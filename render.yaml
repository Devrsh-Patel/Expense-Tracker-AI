services:
  # Backend API Web Service
  - type: web
    name: fintracker-backend
    env: python
    region: oregon
    plan: free
    rootDir: Fintracker_Backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn fintracker_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend-app.vercel.app,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://your-frontend-app.vercel.app,https://fintracker-backend.onrender.com"

